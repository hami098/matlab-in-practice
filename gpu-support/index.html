<!doctype html>
<html>
<head><meta charset="utf-8"><title>gpu-support</title></head>
<body>
<pre id="result"></pre>
<script>
async function webgpu() {
  if (!navigator.gpu) return { available: false, reason: "navigator.gpu is missing" };
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return { available: false, reason: "no adapter" };
  const device = await adapter.requestDevice();
  const result = {
    available: true,
    vendor: adapter.info?.vendor ?? "",
    architecture: adapter.info?.architecture ?? "",
    maxBufferSize: adapter.limits.maxBufferSize
  };
  device.destroy();
  return result;
}

function webgl2() {
  const gl = document.createElement("canvas").getContext("webgl2");
  if (!gl) return { available: false };
  return { available: true, renderer: gl.getParameter(gl.RENDERER), maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE) };
}

async function check() {
  return {
    userAgent: navigator.userAgent,
    webgpu: await webgpu().catch(error => ({ available: false, reason: String(error) })),
    webgl2: webgl2()
  };
}

const result = check();
result.then(answer => document.getElementById("result").textContent = JSON.stringify(answer, null, 2));

function setup(htmlComponent) {
  result.then(answer => htmlComponent.sendEventToMATLAB("result", answer));
}
</script>
</body>
</html>
