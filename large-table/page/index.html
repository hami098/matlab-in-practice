<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>large-table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<select id="size" title="Rows of history"><option value="1000000">1M rows</option><option value="10000000" selected>10M rows</option><option value="50000000">50M rows</option></select>
<button id="live" class="on" title="New rows arrive while this is on">Live</button>
<button id="reset" title="Clear every filter and the sort">Reset</button>
<span id="status">Waiting for MATLAB</span>
</header>
<div id="progress" class="busy"><div></div></div>
<section id="grid" tabindex="0">
<div class="head"></div>
<div class="filters"></div>
<div class="viewport"><div class="body"></div><button id="news" hidden></button></div>
<div class="track"><div class="thumb"></div></div>
</section>
<footer>Synthetic data, generated at random for this demo. No real patients; values and reference ranges are illustrative, not clinical.</footer>
<script src="grid.js"></script>
<script src="app.js"></script>
</body>
</html>
